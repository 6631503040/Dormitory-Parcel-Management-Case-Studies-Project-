# Isolated test database for the regression round (docs/03-test). Separate project, separate port,
# data on tmpfs: it never touches the dev database (5432) and is wiped on `down`.
#
#   docker compose -f docker/docker-compose.test.yml -p dpms-test up -d
#   export TEST_DATABASE_URL='postgres://dpms_test:dpms_test@127.0.0.1:15432/dpms_test?sslmode=disable'
#   docker compose -f docker/docker-compose.test.yml -p dpms-test down

services:
  testdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dpms_test
      POSTGRES_USER: dpms_test
      POSTGRES_PASSWORD: dpms_test # test-only, loopback-only, throwaway data
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpms_test -d dpms_test"]
      interval: 2s
      timeout: 3s
      retries: 20
