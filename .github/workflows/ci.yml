# CI: every pull request and every push to main must pass these checks. Render deploys main only
# after they pass (Auto-Deploy: "After CI checks pass"), so a red check never reaches the live site.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dpms_ci
          POSTGRES_USER: dpms
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dpms -d dpms_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      # With TEST_DATABASE_URL set the integration tests run against a real, fresh PostgreSQL (and so
      # also prove every migration applies cleanly); without it they would silently skip.
      - name: go test
        env:
          TEST_DATABASE_URL: postgres://dpms:ci-only-password@localhost:5432/dpms_ci?sslmode=disable
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/02-design/prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/02-design/prototype/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build (docker/app.Dockerfile — what Render builds)
        run: docker build -f docker/app.Dockerfile -t dpms:ci .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner
